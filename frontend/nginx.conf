# Served by nginx-unprivileged (non-root, port 8080, read-only root fs + tmpfs for /tmp and
# /var/cache/nginx). SPA + same-origin /api proxy. Only /api/ reaches the backend: /internal/* (worker
# callbacks) and /metrics are never proxied.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Texture uploads (10 MB) + multipart overhead.
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    # model/gltf-binary is already compact; JSON (inventories, versions) and JS/CSS compress well.
    gzip_types application/javascript text/css application/json image/svg+xml text/plain;

    # Security headers. nginx drops inherited add_header lines in any location that adds its own,
    # so locations that add headers include this file again.
    include /etc/nginx/conf.d/security-headers.inc;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        # SSE (job events): no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 120s;
    }

    location /internal/ { return 404; }
    location = /metrics { return 404; }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets: cache forever.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deployment is picked up immediately.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
