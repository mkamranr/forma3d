name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (shared, backend, workers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            agent-worker/requirements*.txt
            blender-worker/requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e shared -r backend/requirements-dev.txt \
            -r agent-worker/requirements-dev.txt -r blender-worker/requirements-dev.txt
      - name: Lint
        run: ruff check backend agent-worker blender-worker shared
      - name: Shared contracts
        working-directory: shared
        run: python -m pytest -q
      - name: Backend
        working-directory: backend
        run: python -m pytest -q
      - name: Agent worker
        working-directory: agent-worker
        run: python -m pytest -q
      - name: Blender worker (Blender integration tests are skipped without Blender)
        working-directory: blender-worker
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
