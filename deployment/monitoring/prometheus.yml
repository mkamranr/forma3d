# Scrapes the backend's /metrics on the internal `data` network (never exposed publicly).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: forma3d-backend
    metrics_path: /metrics
    # With METRICS_TOKEN set in .env, put the same value in deployment/monitoring/metrics_token.
    authorization:
      credentials_file: /etc/prometheus/metrics_token
    dns_sd_configs:
      # every backend replica (Compose DNS returns one A record per container)
      - names: [backend]
        type: A
        port: 8000
