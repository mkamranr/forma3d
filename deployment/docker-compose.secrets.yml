# Secrets from files instead of .env (spec §15.17). Create them with
#   deployment/scripts/generate-secrets.sh --files
# then start with
#   docker compose --env-file .env -f deployment/docker-compose.yml -f deployment/docker-compose.secrets.yml up -d
# and leave JWT_SECRET / INTERNAL_SERVICE_TOKEN / POSTGRES_PASSWORD empty in .env (DATABASE_URL and
# CHECKPOINT_URL without a password: it is injected from the secret).
# Files are mounted read-only at /run/secrets/<name>; the services read them via *_FILE / SECRETS_DIR.

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret
  internal_service_token:
    file: ./secrets/internal_service_token
  database_password:
    file: ./secrets/database_password
  llm_api_key:
    file: ./secrets/llm_api_key

services:
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]

  migrate:
    secrets: [database_password]

  backend:
    secrets: [jwt_secret, internal_service_token, database_password]

  agent-worker:
    environment:
      CHECKPOINT_URL: postgresql://${POSTGRES_USER:-forma3d}@postgres:5432/${POSTGRES_DB:-forma3d}
    secrets: [internal_service_token, database_password, llm_api_key]

  blender-worker:
    secrets: [internal_service_token]
